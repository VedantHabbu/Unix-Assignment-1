# policy.conf - rules for perm_scanner.sh
#
#   CHECK world_writable      files/dirs anyone can write to (sticky dirs are ignored)
#   CHECK executable <dir>    executable files inside <dir>
#   CHECK setuid              files with the SUID or SGID bit
#   EXCLUDE <path>            skip this path completely
#
# Relative paths are relative to the directory being scanned.

CHECK world_writable
CHECK setuid
CHECK executable tmp
CHECK executable uploads

EXCLUDE .cache
EXCLUDE build
